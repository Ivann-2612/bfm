name: Keep-alive

on:
  schedule:
    - cron: "0 7 * * 1" # Mondays 07:00 UTC
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    env:
      SITE_URL: ${{ vars.NEXT_PUBLIC_SITE_URL || 'https://belgrademagicfestival.rs' }}
      FUNCTION_URL: ${{ vars.NEXT_PUBLIC_FUNCTIONS_URL || 'https://pnpylpzcgoulsivplhip.supabase.co/functions/v1' }}
    steps:
      - name: Site responds
        run: curl --fail --silent --show-error --max-time 30 "$SITE_URL/" -o /dev/null

      - name: Expire function (keeps the DB warm)
        env:
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          if [ -z "$CRON_SECRET" ]; then
            echo "::warning::CRON_SECRET is not set; skipping the function call."
            exit 0
          fi
          curl --fail --silent --show-error --max-time 30 \
            -H "Authorization: Bearer $CRON_SECRET" \
            "$FUNCTION_URL/expire"
