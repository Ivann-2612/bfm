name: Keep-alive

on:
  schedule:
    - cron: "0 7 * * 1"
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    env:
      SITE_URL: ${{ vars.NEXT_PUBLIC_SITE_URL || 'https://belgrademagicfestival.rs' }}
      FUNCTION_URL: ${{ vars.NEXT_PUBLIC_FUNCTIONS_URL || 'https://pnpylpzcgoulsivplhip.supabase.co/functions/v1' }}
    steps:
      - name: Site responds
        run: curl --fail --silent --show-error --max-time 30 "$SITE_URL/" -o /dev/null

      - name: Database responds
        run: curl --fail --silent --show-error --max-time 30 "$FUNCTION_URL/tickets?ping=1"
